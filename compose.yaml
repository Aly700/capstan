# Local development and tests only. One shared PostgreSQL; tests create and drop their own
# databases, so it never needs resetting. Durability is off because nothing here is precious.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: capstan
      POSTGRES_PASSWORD: capstan
      POSTGRES_DB: capstan
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off", "-c", "max_connections=400"]
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capstan -d capstan"]
      interval: 2s
      timeout: 3s
      retries: 30
