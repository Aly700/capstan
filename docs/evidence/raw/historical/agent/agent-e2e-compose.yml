services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentops_gate
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs,s3
      AWS_DEFAULT_REGION: us-east-1
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          awslocal sqs get-queue-url --queue-name agentops-gate-approvals >/dev/null 2>&1 &&
          awslocal s3api head-bucket --bucket agentops-gate-audit >/dev/null 2>&1
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:14566:4566"
    volumes:
      - /Users/affan/Projects/agentops-gate/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro

  app:
    build:
      context: "/Users/affan/Projects/agentops-gate"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/agentops_gate
      DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER must be set}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      AGENTOPS_API_KEY: ${AGENTOPS_API_KEY:?AGENTOPS_API_KEY must be set}
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      APPROVAL_QUEUE_URL: http://localstack:4566/000000000000/agentops-gate-approvals
      APPROVAL_DLQ_URL: http://localstack:4566/000000000000/agentops-gate-approvals-dlq
      APPROVAL_WORKER_ENABLED: "true"
      SQS_WAIT_TIME_SECONDS: "20"
      AUDIT_BUCKET: agentops-gate-audit
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
