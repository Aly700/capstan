name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: capstan
          POSTGRES_PASSWORD: capstan
          POSTGRES_DB: capstan
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U capstan -d capstan"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      CAPSTAN_TEST_DATABASE_URL: postgres://capstan:capstan@127.0.0.1:55432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.4"
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - uses: bufbuild/buf-action@v1
        with:
          # Install buf only; make verify runs lint and generation itself.
          setup_only: true
          version: "1.73.0"
          # Authenticated release lookup; anonymous calls share the runner IP's rate limit.
          github_token: ${{ github.token }}
      - name: Install protoc plugins at module versions
        run: |
          protobuf_version=$(go list -m -f '{{.Version}}' google.golang.org/protobuf)
          connect_version=$(go list -m -f '{{.Version}}' connectrpc.com/connect)
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@$protobuf_version"
          go install "connectrpc.com/connect/cmd/protoc-gen-connect-go@$connect_version"
      - run: npm ci
        working-directory: sdk
      - run: make verify

  evidence:
    # Every published number is recomputed from committed raw data; the script also refuses
    # unreviewed source drift since the measured revisions, so it needs the full history.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git fetch origin '+refs/replace/*:refs/replace/*'
      - run: python3 docs/evidence/raw/verify-numbers.py

  infra:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      AWS_CONFIG_FILE: /dev/null
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
        working-directory: infra
      - run: npm run typecheck && npm test
        working-directory: infra
      - run: npx cdk synth --no-lookups -c imageTag=test -c budgetEmail=test@example.com
        working-directory: infra
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
