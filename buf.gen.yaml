version: v2
clean: true
plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: gen
    opt: paths=source_relative
  - local: sdk/node_modules/.bin/protoc-gen-es
    out: sdk/src/gen
    opt:
      - target=ts
      - import_extension=js
